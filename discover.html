<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidden Egypt | Discover Egypt</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>


  <main>
    <section class="container text-center py-4">
      <h1 class="page-title">Discover Egypt</h1>
      <p class="page-subtitle">Click on any location to flip it and see the place</p>
    </section>
        <section class="container mb-5">
      <div class="journey">
        <div class="journey-line"></div>
        <div class="journey-start">Start</div>

        <div class="journey-row left">
          <span class="journey-dot"></span>
          <input type="checkbox" id="p1" class="flip-toggle">
          <label for="p1" class="flip-card">
            <div class="flip-inner">
              <div class="flip-front">
                <span class="flip-icon"><svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor"><path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/></svg></span>
                <h5 class="place-name">Fayoum</h5>
                <span class="place-region">Fayoum</span>
              </div>
              <div class="flip-back">
                <h6>Fayoum</h6>
                <p>Lakes, pottery villages and green farms close to Cairo.</p>
                <span class="flip-chip">1 day</span>
              </div>
            </div>
          </label>
        </div>

        <div class="journey-row right">
          <span class="journey-dot"></span>
          <input type="checkbox" id="p2" class="flip-toggle">
          <label for="p2" class="flip-card">
            <div class="flip-inner">
              <div class="flip-front">
                <span class="flip-icon"><svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor"><path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/></svg></span>
                <h5 class="place-name">Wadi El Rayan</h5>
                <span class="place-region">Fayoum</span>
              </div>
              <div class="flip-back">
                <h6>Wadi El Rayan</h6>
                <p>Egypt's only waterfalls between two desert lakes.</p>
                <span class="flip-chip">1 day</span>
              </div>
            </div>
          </label>
        </div>

        <div class="journey-row left">
          <span class="journey-dot"></span>
          <input type="checkbox" id="p3" class="flip-toggle">
          <label for="p3" class="flip-card">
            <div class="flip-inner">
              <div class="flip-front">
                <span class="flip-icon"><svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor"><path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/></svg></span>
                <h5 class="place-name">Wadi Al-Hitan</h5>
                <span class="place-region">Fayoum</span>
              </div>
              <div class="flip-back">
                <h6>Wadi Al-Hitan</h6>
                <p>Whale fossils millions of years old in the open desert.</p>
                <span class="flip-chip">1 day</span>
              </div>
            </div>
          </label>
        </div>

        <div class="journey-row right">
          <span class="journey-dot"></span>
          <input type="checkbox" id="p4" class="flip-toggle">
          <label for="p4" class="flip-card">
            <div class="flip-inner">
              <div class="flip-front">
                <span class="flip-icon"><svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor"><path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/></svg></span>
                <h5 class="place-name">Bahariya Oasis</h5>
                <span class="place-region">Giza</span>
              </div>
              <div class="flip-back">
                <h6>Bahariya Oasis</h6>
                <p>Hot springs, palm groves and the gateway to the deserts.</p>
                <span class="flip-chip">2 days</span>
              </div>
            </div>
          </label>
        </div>

        <div class="journey-row left">
          <span class="journey-dot"></span>
          <input type="checkbox" id="p5" class="flip-toggle">
          <label for="p5" class="flip-card">
            <div class="flip-inner">
              <div class="flip-front">
                <span class="flip-icon"><svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor"><path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/></svg></span>
                <h5 class="place-name">Black Desert</h5>
                <span class="place-region">Giza</span>
              </div>
              <div class="flip-back">
                <h6>Black Desert</h6>
                <p>Volcanic black hills scattered over golden sand.</p>
                <span class="flip-chip">1 day</span>
              </div>
            </div>
          </label>
        </div>

        <div class="journey-row right">
          <span class="journey-dot"></span>
          <input type="checkbox" id="p6" class="flip-toggle">
          <label for="p6" class="flip-card">
            <div class="flip-inner">
              <div class="flip-front">
                <span class="flip-icon"><svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor"><path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/></svg></span>
                <h5 class="place-name">White Desert</h5>
                <span class="place-region">New Valley</span>
              </div>
              <div class="flip-back">
                <h6>White Desert</h6>
                <p>Chalk rock formations and camping under the stars.</p>
                <span class="flip-chip">2 days</span>
              </div>
            </div>
          </label>
        </div>

        <div class="journey-row left">
          <span class="journey-dot"></span>
          <input type="checkbox" id="p7" class="flip-toggle">
          <label for="p7" class="flip-card">
            <div class="flip-inner">
              <div class="flip-front">
                <span class="flip-icon"><svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor"><path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/></svg></span>
                <h5 class="place-name">Gilf Kebir</h5>
                <span class="place-region">New Valley</span>
              </div>
              <div class="flip-back">
                <h6>Gilf Kebir</h6>
                <p>A remote plateau with prehistoric cave paintings.</p>
                <span class="flip-chip">4 days</span>
              </div>
            </div>
          </label>
        </div>

        <div class="journey-row right">
          <span class="journey-dot"></span>
          <input type="checkbox" id="p8" class="flip-toggle">
          <label for="p8" class="flip-card">
            <div class="flip-inner">
              <div class="flip-front">
                <span class="flip-icon"><svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor"><path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/></svg></span>
                <h5 class="place-name">Siwa Oasis</h5>
                <span class="place-region">Matrouh</span>
              </div>
              <div class="flip-back">
                <h6>Siwa Oasis</h6>
                <p>Salt lakes, natural springs and the Shali fortress.</p>
                <span class="flip-chip">3 days</span>
              </div>
            </div>
          </label>
        </div>

        <div class="journey-row left">
          <span class="journey-dot"></span>
          <input type="checkbox" id="p9" class="flip-toggle">
          <label for="p9" class="flip-card">
            <div class="flip-inner">
              <div class="flip-front">
                <span class="flip-icon"><svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor"><path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/></svg></span>
                <h5 class="place-name">Wadi El-Washwash</h5>
                <span class="place-region">South Sinai</span>
              </div>
              <div class="flip-back">
                <h6>Wadi El-Washwash</h6>
                <p>A hidden freshwater pool between granite canyon walls.</p>
                <span class="flip-chip">1 day</span>
              </div>
            </div>
          </label>
        </div>

        <div class="journey-end">
          <p>End of the journey</p>
          <a href="trip.html" class="btn btn-gold">Build Your Trip</a>
        </div>
      </div>
    </section>

    
    </section>
  </main>

  <div id="footer"></div>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/trip-map.js"></script>
</body>
</html>
