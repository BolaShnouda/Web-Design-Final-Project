<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidden Egypt </title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="trip-page">
  <div id="navbar"></div>

  <main>
    <section class="container text-center pt-5 pb-4">
      <h1 class="page-title">Build Your Trip</h1>
    </section>

    <section class="container trip-container mb-5">
      <form class="glass-card mb-4">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="budget" class="form-label">Budget (EGP)</label>
            <input type="number" class="form-control" id="budget" placeholder="e.g. 15000" min="1000" required>
          </div>
          <div class="col-md-6">
            <label for="travelers" class="form-label">Travelers</label>
            <select class="form-select" id="travelers">
              <option>1 person</option>
              <option selected>2 people</option>
              <option>3 people</option>
              <option>4+ people</option>
            </select>
          </div>

          <div class="col-md-6">
            <label for="startDate" class="form-label">Start Date</label>
            <input type="date" class="form-control" id="startDate" required>
          </div>
          <div class="col-md-6">
            <label for="endDate" class="form-label">End Date</label>
            <input type="date" class="form-control" id="endDate" required>
          </div>

          <div class="col-12">
            <label for="type" class="form-label">Adventure Type</label>
            <select class="form-select" id="type">
              <option>All</option>
              <option>Desert</option>
              <option>Oases</option>
              <option>Sea &amp; Diving</option>
              <option>History</option>
              <option>Mountains</option>
            </select>
          </div>

          <div class="col-12 mt-4">
            <button type="submit" class="btn btn-gold w-100">Suggest My Trip</button>
          </div>
        </div>
      </form>

      <div class="glass-card">
        <h4 class="plan-title">Trip Plan</h4>
        <div class="timeline">
             <div class="timeline-line"></div>
          <div class="timeline-item">
                        <span class="timeline-dot"></span>
            <span class="timeline-day">Day 1</span>
            <h6>Wadi Al-Hitan</h6>
            <p>Whale fossils in the heart of the desert.</p>
          </div>
          <div class="timeline-item">
                        <span class="timeline-dot"></span>
            <span class="timeline-day">Day 2 - 3</span>
            <h6>White Desert</h6>
            <p>Safari and camping under the stars.</p>
          </div>
          <div class="timeline-item">
                        <span class="timeline-dot"></span>
            <span class="timeline-day">Day 4 - 5</span>
            <h6>Siwa Oasis</h6>
            <p>Salt lakes and the Shali fortress.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/trip-map.js"></script>
</body>
</html>
